name: Binder link comment
on:
  pull_request_target:
    types: [opened]

jobs:
  binder:
    name: Add/update Comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: jupyterlab/maintainer-tools/.github/actions/binder-link@21b1cac622018fd37ec13a1c8081da814e10d94e # v1
        with:
          github_token: ${{ secrets.github_token }}
