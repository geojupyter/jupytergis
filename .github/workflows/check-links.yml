name: Check links

on:
  push:
    branches: main
  pull_request:
    branches: '*'

permissions: {}

jobs:
  check_links:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@21b1cac622018fd37ec13a1c8081da814e10d94e # v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@21b1cac622018fd37ec13a1c8081da814e10d94e # v1
        with:
          ignore_links: >-
            lite/
            https://www\.npmjs\.com.*
            ^/.*
            https://blog\.jupyter\.org/.*
            https://medium\.com/.*
