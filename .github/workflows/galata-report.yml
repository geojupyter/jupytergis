name: Galata Diff Report

# After `Build` finishes, collect its Galata (Playwright) snapshot diffs and post
# them as a PR comment so reviewers see the pixels inline.
#
# Diffs are pushed to a separate public repo (geojupyter/jupytergis-galata-diffs)
# to keep this repo's history clean; the comment embeds them via raw URLs.
#
# Needs a secret GALATA_DIFFS_TOKEN with contents:write on the diffs repo
# (GITHUB_TOKEN can't push to another repo).

on:
  # Runs in base-repo context so it can comment on fork PRs, which Build can't.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Build]
    types: [completed]
  # Drop a PR's diffs once it closes. Only reads the PR number, never PR code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]
  # Weekly squash so overwritten blobs can be garbage-collected.
  schedule:
    - cron: '0 3 * * 0' # 03:00 UTC every Sunday

permissions:
  contents: read # diffs go to a separate repo via GALATA_DIFFS_TOKEN
  pull-requests: write # the sticky comment
  actions: read # download build artifacts

# Serialize every push to the diffs repo.
concurrency:
  group: galata-diffs
  cancel-in-progress: false

env:
  DIFFS_REPO: geojupyter/jupytergis-galata-diffs

jobs:
  report:
    name: Post snapshot diffs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download artifacts from the triggering run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: '{pr-number,jupytergis-playwright-tests,jupytergis-lite-playwright-tests}'
          path: /tmp/artifacts # untrusted artifacts: keep them off the checkout

      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          # No PR number means we can't map the Build to a PR to comment on.
          if [[ ! -f /tmp/artifacts/pr-number/pr_number.txt ]]; then
            echo "::error::No pr-number artifact found in the triggering run." >&2
            exit 1
          fi
          num=$(tr -dc '0-9' < /tmp/artifacts/pr-number/pr_number.txt)
          echo "number=${num}" >> "$GITHUB_OUTPUT"

      - name: Collect snapshot diffs
        id: collect
        if: steps.pr.outputs.number != ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          # Playwright `retries` in the ui-tests configs. Keep in sync.
          RETRIES = 1

          collected = Path("collected")
          collected.mkdir()

          # Playwright writes <name>-{diff,actual,expected}.<ext> per failed
          # attempt; <ext> is png for most specs, jpg for the showcase specs.
          # Retries land in sibling "-retryN" dirs (attempt 0 has no suffix).
          diffs = []
          for ext in ("png", "jpg", "jpeg"):
              diffs += glob.glob(
                  f"/tmp/artifacts/**/test-results/**/*-diff.{ext}", recursive=True
              )

          entries = []
          skipped = 0
          for diff in diffs:
              diff_path = Path(diff)
              attempt_dir = diff_path.parent
              m = re.search(r"-retry(\d+)$", attempt_dir.name)
              attempt = int(m.group(1)) if m else 0
              # Only the final attempt counts: an earlier-only diff means the test
              # passed on retry (flaky). This also dedupes genuine failures.
              if attempt != RETRIES:
                  skipped += 1
                  continue
              ext = diff_path.suffix  # e.g. ".jpg"
              base = diff_path.name.removesuffix(f"-diff{ext}")
              slug = re.sub(r"[^a-zA-Z0-9._-]", "_", str(attempt_dir / base))
              out = collected / slug
              out.mkdir()
              shutil.copy(diff_path, out / f"diff{ext}")
              for kind in ("actual", "expected"):
                  shutil.copy(attempt_dir / f"{base}-{kind}{ext}", out / f"{kind}{ext}")
              display_dir = re.sub(r"-retry\d+$", "", attempt_dir.name)
              entries.append(
                  {"name": base, "dir": display_dir, "slug": slug, "ext": ext}
              )

          (collected / "manifest.json").write_text(json.dumps(entries, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"count={len(entries)}\n")
          print(f"Collected {len(entries)} diff(s); skipped {skipped} non-final.")
          PY

      - name: Publish diffs to the diffs repo
        id: publish
        if: steps.collect.outputs.count != '' && steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GALATA_DIFFS_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GALATA_DIFFS_TOKEN is not set; cannot publish diffs." >&2
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          dest="pr-${PR}"
          repo_dir="$(mktemp -d)"
          url="https://x-access-token:${GH_TOKEN}@github.com/${DIFFS_REPO}.git"

          # Clone the diffs repo, or start a fresh main if it's still empty.
          if ! git clone --quiet --depth 1 "$url" "$repo_dir" 2>/dev/null; then
            git init --quiet "$repo_dir"
            git -C "$repo_dir" remote add origin "$url"
          fi
          git -C "$repo_dir" checkout --quiet -B main

          # One folder per PR, overwritten each run.
          rm -rf "${repo_dir:?}/${dest:?}"
          mkdir -p "$repo_dir/$dest"
          cp -r collected/. "$repo_dir/$dest/"

          git -C "$repo_dir" add -A
          if git -C "$repo_dir" diff --cached --quiet; then
            echo "No changes to publish."
          else
            git -C "$repo_dir" commit --quiet -m "Galata diffs for PR #${PR} (run ${RUN_ID})"
            for i in 1 2 3 4 5; do
              if git -C "$repo_dir" push --quiet origin HEAD:main; then
                break
              fi
              echo "push failed (attempt $i), rebasing and retrying..."
              git -C "$repo_dir" pull --quiet --rebase origin main || true
              sleep "$i" # linear backoff
            done
          fi

          echo "base_url=https://raw.githubusercontent.com/${DIFFS_REPO}/main/${dest}" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          BASE_URL: ${{ steps.publish.outputs.base_url }}
          COUNT: ${{ steps.collect.outputs.count }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- galata-diff-report -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const count = Number(process.env.COUNT || '0');
            const baseUrl = process.env.BASE_URL || '';
            const bust = process.env.RUN_ID; // cache-bust the overwritten images
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${process.env.RUN_ID}`;

            // Reuse one sticky comment.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            let body;
            if (!count) {
              if (!existing) {
                core.info('No diffs and no prior comment; staying silent.');
                return;
              }
              body = `${marker}\n### ✅ Galata snapshots match\n\n`
                + `No visual snapshot differences in the [latest run](${runUrl}).`;
            } else {
              const entries = JSON.parse(fs.readFileSync('collected/manifest.json', 'utf8'));
              const esc = s => String(s).replace(/[&<>"']/g,
                c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
              const cell = (slug, kind, ext) => // ext falls back for old manifests
                `<img src="${baseUrl}/${slug}/${kind}${ext}?${bust}" width="240">`;
              const blocks = entries.map(e => {
                const ext = e.ext || '.png';
                const row = `| ${cell(e.slug, 'expected', ext)} `
                  + `| ${cell(e.slug, 'actual', ext)} `
                  + `| ${cell(e.slug, 'diff', ext)} |`;
                // Collapsed so a run with many diffs stays scannable.
                return `<details>\n<summary><b>${esc(e.name)}</b></summary>\n\n`
                  + `<sub>${esc(e.dir)}</sub>\n\n`
                  + `| Expected | Actual | Diff |\n|---|---|---|\n${row}\n\n</details>`;
              }).join('\n\n');
              body = `${marker}\n### 🖼️ Galata snapshot diffs (${count})\n\n`
                + `These UI snapshots changed in [this run](${runUrl}). `
                + `If the changes are intended, comment `
                + '`please update snapshots`'
                + ` to regenerate the references.\n\n${blocks}\n\n`
                + `<sub>📦 Full Playwright report: download the `
                + `\`jupytergis-playwright-tests\` artifact from the [run](${runUrl}).</sub>`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

  cleanup:
    name: Remove diffs for closed PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - name: Delete the PR's diff folder from the diffs repo
        env:
          GH_TOKEN: ${{ secrets.GALATA_DIFFS_TOKEN }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "GALATA_DIFFS_TOKEN not set; skipping cleanup." >&2
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          dest="pr-${PR}"
          repo_dir="$(mktemp -d)"
          url="https://x-access-token:${GH_TOKEN}@github.com/${DIFFS_REPO}.git"

          if ! git clone --quiet --depth 1 "$url" "$repo_dir" 2>/dev/null; then
            echo "Diffs repo is empty; nothing to clean."
            exit 0
          fi
          if [[ ! -d "${repo_dir}/${dest}" ]]; then
            echo "No diffs stored for PR #${PR}."
            exit 0
          fi

          rm -rf "${repo_dir:?}/${dest:?}"
          git -C "$repo_dir" add -A
          git -C "$repo_dir" commit --quiet -m "Remove diffs for closed PR #${PR}"
          for i in 1 2 3 4 5; do
            if git -C "$repo_dir" push --quiet origin HEAD:main; then
              break
            fi
            echo "push failed (attempt $i), rebasing and retrying..."
            git -C "$repo_dir" pull --quiet --rebase origin main || true
            sleep "$i"
          done

      - name: Remove the sticky comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = '<!-- galata-diff-report -->';
            const prNumber = Number(context.payload.number);
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            }

  reorphan:
    name: Squash diffs history
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Re-orphan the diffs repo to reclaim space
        env:
          GH_TOKEN: ${{ secrets.GALATA_DIFFS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "GALATA_DIFFS_TOKEN not set; skipping." >&2
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          repo_dir="$(mktemp -d)"
          url="https://x-access-token:${GH_TOKEN}@github.com/${DIFFS_REPO}.git"
          if ! git clone --quiet --depth 1 "$url" "$repo_dir" 2>/dev/null; then
            echo "Diffs repo is empty; nothing to squash."
            exit 0
          fi

          # Replace all history with a single commit of the current tree.
          git -C "$repo_dir" checkout --quiet --orphan squashed
          git -C "$repo_dir" add -A
          if git -C "$repo_dir" diff --cached --quiet; then
            echo "Diffs repo has no content; nothing to squash."
            exit 0
          fi
          git -C "$repo_dir" commit --quiet -m "Squash galata diffs history ($(date -u +%Y-%m-%d))"
          git -C "$repo_dir" push --quiet --force origin squashed:main
