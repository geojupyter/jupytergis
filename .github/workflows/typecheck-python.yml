name: 'Typecheck Python'

on:
  push:
    branches: 'main'
  pull_request:
    branches: '*'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions: {}

jobs:
  mypy:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Setup pnpm'
        uses: 'pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413' # v6.1.0
        with:
          cache: true

      - name: 'Install Conda environment with Micromamba'
        uses: 'mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39' # v3.2.1
        with:
          cache-environment: true
          environment-name: 'gis'
          create-args: >-
            python=3.13
            pip
            qgis

      - name: 'Setup pip cache'
        uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: '~/.cache/pip'
          key: pip-${{ hashFiles('package.json') }}
          restore-keys: |
            pip-

      - name: 'Install build dependencies'
        shell: 'bash -l {0}'
        run: 'pip install --group build'

      - name: 'Install'
        shell: 'bash -l {0}'
        run: 'python scripts/dev-install.py'

      # NOTE: Requires JavaScript build to generate Python types!
      - name: 'Run mypy for jupytergis packages'
        shell: 'bash -l {0}'
        run: 'mypy'

      - name: 'Install the latest version of uv'
        uses: 'astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7' # v10.2.0
        with:
          enable-cache: true

      - name: 'Run mypy for layer_gallery'
        working-directory: './scripts/layer_gallery'
        run: 'uv run --group dev mypy'
