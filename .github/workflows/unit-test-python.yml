name: Unit test Python

on:
  push:
    branches: main
  pull_request:
    branches: '*'
    paths:
      - 'python/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/unit-test-python.yml'

permissions: {}

jobs:
  unit-test-python:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: true

      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3.1.0
        with:
          environment-name: gis
          create-args: >-
            python=${{ matrix.python-version }}
            qgis

      - name: Install
        shell: bash -l {0}
        run: python scripts/dev-install.py

      - name: Install test packages
        shell: bash -l {0}
        run: pip install --group test

      - name: Run QGIS tests
        shell: bash -l {0}
        run: pytest --color=yes -v python/jupytergis_qgis/jupytergis_qgis/tests

      - name: Run Python API tests
        shell: bash -l {0}
        run: pytest --color=yes -v python/jupytergis_lab/

      - name: Run layer gallery generator tests
        working-directory: ./scripts/layer_gallery
        shell: bash -l {0}
        run: uv run pytest --color=yes -v
